server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI（联网搜索工具），建议用环境变量注入
search-api:
  api-key: ${SEARCH_API_KEY:你的 API Key}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG

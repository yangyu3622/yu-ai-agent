spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  ai:
    # ============================================================
    # 【2026 必改项】SAA 1.1.x 起，DashScope 的自动配置类带了
    # @ConditionalOnProperty(name="spring.ai.model.chat", havingValue="dashscope")
    # 不写这两行，DashScopeChatModel / DashScopeEmbeddingModel 的 Bean 根本不会创建，
    # 项目启动直接报 "No qualifying bean of type ChatModel"。
    # ============================================================
    model:
      chat: dashscope
      embedding: dashscope
    # 阿里云百炼（灵积）DashScope
    dashscope:
      # 强烈建议用环境变量注入：export AI_DASHSCOPE_API_KEY=sk-xxxx
      api-key: ${AI_DASHSCOPE_API_KEY:your-api-key}
      chat:
        options:
          model: qwen-plus
    # 本地大模型（可选；不配 spring.ai.model.chat=ollama 时不会创建 Ollama 的 ChatModel）
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b

server {
    listen       80;
    server_name  _;

    # 前端静态文件根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 开启 gzip，首屏体积能压掉 60%+
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 所有 HTML 请求都返回 index.html（解决 Vue history 路由刷新 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 请求反向代理到本机后端
    # 【2026 改动】原版写死了 proxy_pass https://www.codefather.cn/api/，
    # 部署到自己服务器后所有请求都会打到鱼皮的线上环境，必须改成本机回环地址。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8123/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（Server-Sent Events）必需配置：关掉缓冲，否则流式输出会攒到最后一次性返回
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_intercept_errors off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
